services:
  nginx-lua:
    image: openresty/openresty:alpine
    container_name: llm-proxy-lua
    restart: unless-stopped
    ports:
      - "9999:9999"
    environment:
      LLM_BACKEND: host.docker.internal:21025
      TEMP_ENDPOINT: "http://host.docker.internal:18082/temperatures"
      STALL_ABOVE: "72"
      RESUME_BELOW: "60"
      TEMP_POLL_INTERVAL: "1.0"
      TEMP_CACHE_TTL: "0.9"
      TEMP_HTTP_TIMEOUT: "5000"
      STALL_LOG: "/var/log/nginx/completions/stall.log"
      # Keep-alive heartbeat for streaming clients: fake empty SSE chunks start
      # KEEPALIVE_DELAY seconds after the request was received and repeat every
      # KEEPALIVE_INTERVAL seconds until the upstream response arrives.
      KEEPALIVE_DELAY: "3"
      KEEPALIVE_INTERVAL: "5"
    volumes:
      - ./nginx/lua/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      - ./nginx/lua/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/lua:/etc/nginx/lua:ro
      - ./logs:/var/log/nginx/completions
    command:
      - /bin/sh
      - -c
      - |
        : "$${LLM_BACKEND:?LLM_BACKEND must be set}"
        : "$${TEMP_ENDPOINT:?TEMP_ENDPOINT must be set}"
        : "$${STALL_ABOVE:?STALL_ABOVE must be set}"
        : "$${RESUME_BELOW:?RESUME_BELOW must be set}"
        : "$${TEMP_POLL_INTERVAL:?TEMP_POLL_INTERVAL must be set}"
        : "$${TEMP_CACHE_TTL:?TEMP_CACHE_TTL must be set}"
        : "$${TEMP_HTTP_TIMEOUT:?TEMP_HTTP_TIMEOUT must be set}"
        : "$${STALL_LOG:?STALL_LOG must be set}"
        : "$${KEEPALIVE_DELAY:?KEEPALIVE_DELAY must be set}"
        : "$${KEEPALIVE_INTERVAL:?KEEPALIVE_INTERVAL must be set}"
        mkdir -p /var/log/nginx/completions /etc/nginx/conf.d &&
        chown nobody:nobody /var/log/nginx/completions &&
        escp() { printf '%s' "$1" | sed 's/[\\/&]/\\&/g'; } &&
        sed -e 's/\$${LLM_BACKEND}/'"$$(escp "$$LLM_BACKEND")"'/g' \
            -e 's/\$${TEMP_ENDPOINT}/'"$$(escp "$$TEMP_ENDPOINT")"'/g' \
            -e 's/\$${STALL_ABOVE}/'"$$(escp "$$STALL_ABOVE")"'/g' \
            -e 's/\$${RESUME_BELOW}/'"$$(escp "$$RESUME_BELOW")"'/g' \
            -e 's/\$${TEMP_POLL_INTERVAL}/'"$$(escp "$$TEMP_POLL_INTERVAL")"'/g' \
            -e 's/\$${TEMP_CACHE_TTL}/'"$$(escp "$$TEMP_CACHE_TTL")"'/g' \
            -e 's/\$${TEMP_HTTP_TIMEOUT}/'"$$(escp "$$TEMP_HTTP_TIMEOUT")"'/g' \
            -e 's/\$${STALL_LOG}/'"$$(escp "$$STALL_LOG")"'/g' \
            -e 's/\$${KEEPALIVE_DELAY}/'"$$(escp "$$KEEPALIVE_DELAY")"'/g' \
            -e 's/\$${KEEPALIVE_INTERVAL}/'"$$(escp "$$KEEPALIVE_INTERVAL")"'/g' \
            /etc/nginx/templates/default.conf.template > /etc/nginx/conf.d/default.conf &&
        /usr/local/openresty/bin/openresty -g 'daemon off;'
