services:
  nginx:
    image: nginx:alpine
    container_name: llm-proxy
    restart: unless-stopped
    ports:
      - "9999:9999"
    environment:
      LLM_BACKEND: 192.168.1.3:1025
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/njs:/etc/nginx/njs:ro
