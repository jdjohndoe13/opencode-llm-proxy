services:
  nginx-lua:
    image: openresty/openresty:alpine
    container_name: llm-proxy-lua
    restart: unless-stopped
    ports:
      - "9999:9999"
    environment:
      # Values come from .env in this directory (docker compose loads it
      # automatically; see .env.example for the variable reference).
      LLM_BACKEND: ${LLM_BACKEND:?LLM_BACKEND must be set (copy .env.example to .env)}
      # top_p forced onto rewritten request bodies. Negative (the default)
      # leaves the client's top_p untouched.
      TOP_P: ${TOP_P:--1}
      # Tool-name guard for markup tool calls: "remap" (default) fixes a
      # hallucinated name when a unique allowed candidate exists, otherwise
      # drops it; "strip" always drops unknown names; "off" disables checking
      # entirely. Any dropped call is replaced by a corrective note in the
      # assistant content. TOOL_NAME_RETRY additionally resends the identical
      # request once when anything would be dropped (nothing payload-bearing
      # reached the client yet) and adopts the fresh sample when it comes
      # back clean.
      TOOL_NAME_GUARD: ${TOOL_NAME_GUARD:-remap}
      TOOL_NAME_RETRY: ${TOOL_NAME_RETRY:-1}
      # GPU temperature checks (cool-down guard). Disabled by default: when
      # TEMP_CHECK_ENABLED is unset or anything other than "1" / "true"
      # (case-insensitive) the checks are off and every other TEMP_CHECK_*
      # variable below is ignored. Set it to "1" or "true" to enable.
      TEMP_CHECK_ENABLED: ${TEMP_CHECK_ENABLED:-0}
      TEMP_CHECK_ENDPOINT: ${TEMP_CHECK_ENDPOINT:-}
      TEMP_CHECK_STALL_ABOVE: ${TEMP_CHECK_STALL_ABOVE:-}
      TEMP_CHECK_RESUME_BELOW: ${TEMP_CHECK_RESUME_BELOW:-}
      TEMP_CHECK_POLL_INTERVAL: ${TEMP_CHECK_POLL_INTERVAL:-}
      TEMP_CHECK_CACHE_TTL: ${TEMP_CHECK_CACHE_TTL:-}
      TEMP_CHECK_HTTP_TIMEOUT: ${TEMP_CHECK_HTTP_TIMEOUT:-}
      TEMP_CHECK_STALL_LOG: ${TEMP_CHECK_STALL_LOG:-}
      # Keep-alive heartbeat for streaming clients: fake empty SSE chunks (and
      # the SSE handshake) start only KEEPALIVE_DELAY seconds after the request
      # was received, then repeat every KEEPALIVE_INTERVAL seconds until the
      # upstream response arrives. The delay gives fast upstream errors a
      # window to come back as plain HTTP errors before the stream commits.
      KEEPALIVE_DELAY: ${KEEPALIVE_DELAY:?KEEPALIVE_DELAY must be set (copy .env.example to .env)}
      KEEPALIVE_INTERVAL: ${KEEPALIVE_INTERVAL:?KEEPALIVE_INTERVAL must be set (copy .env.example to .env)}
    volumes:
      - ./nginx/lua/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      - ./nginx/lua/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/lua:/etc/nginx/lua:ro
      - ./logs:/var/log/nginx/completions
    command:
      - /bin/sh
      - -c
      - |
        : "$${LLM_BACKEND:?LLM_BACKEND must be set}"
        : "$${KEEPALIVE_DELAY:?KEEPALIVE_DELAY must be set}"
        : "$${KEEPALIVE_INTERVAL:?KEEPALIVE_INTERVAL must be set}"

        # Temperature checks: only "1" or "true" (case-insensitive) enables
        # them. Any other value (or an unset TEMP_CHECK_ENABLED) disables the
        # checks; the remaining TEMP_CHECK_* variables are then ignored and
        # the proxy behaves as if every check passed.
        tc_enabled=0
        case "$${TEMP_CHECK_ENABLED}" in
            1|[Tt][Rr][Uu][Ee]) tc_enabled=1 ;;
        esac
        if [ "$$tc_enabled" = "1" ]; then
            : "$${TEMP_CHECK_ENDPOINT:?TEMP_CHECK_ENDPOINT must be set when temperature checks are enabled}"
            : "$${TEMP_CHECK_STALL_ABOVE:?TEMP_CHECK_STALL_ABOVE must be set when temperature checks are enabled}"
            : "$${TEMP_CHECK_RESUME_BELOW:?TEMP_CHECK_RESUME_BELOW must be set when temperature checks are enabled}"
            : "$${TEMP_CHECK_POLL_INTERVAL:?TEMP_CHECK_POLL_INTERVAL must be set when temperature checks are enabled}"
            : "$${TEMP_CHECK_CACHE_TTL:?TEMP_CHECK_CACHE_TTL must be set when temperature checks are enabled}"
            : "$${TEMP_CHECK_HTTP_TIMEOUT:?TEMP_CHECK_HTTP_TIMEOUT must be set when temperature checks are enabled}"
            : "$${TEMP_CHECK_STALL_LOG:?TEMP_CHECK_STALL_LOG must be set when temperature checks are enabled}"
            echo "Temperature checks are ENABLED (TEMP_CHECK_ENABLED=$${TEMP_CHECK_ENABLED})."
        else
            echo "Temperature checks are DISABLED. Set TEMP_CHECK_ENABLED=1 or true to enable them."
        fi

        mkdir -p /var/log/nginx/completions /etc/nginx/conf.d &&
        chown nobody:nobody /var/log/nginx/completions &&
        escp() { printf '%s' "$1" | sed 's/[\\/&]/\\&/g'; } &&
        # tc() returns the escaped value when checks are enabled, otherwise a
        # valid empty nginx string so the set directives never go blank.
        tc() { if [ "$$tc_enabled" = "1" ]; then escp "$1"; else printf '""'; fi; } &&
        sed -e 's/\$${LLM_BACKEND}/'"$$(escp "$$LLM_BACKEND")"'/g' \
            -e 's/\$${TEMP_CHECK_ENABLED}/'"$$(escp "$${TEMP_CHECK_ENABLED:-0}")"'/g' \
            -e 's/\$${TEMP_CHECK_ENDPOINT}/'"$$(tc "$$TEMP_CHECK_ENDPOINT")"'/g' \
            -e 's/\$${TEMP_CHECK_STALL_ABOVE}/'"$$(tc "$$TEMP_CHECK_STALL_ABOVE")"'/g' \
            -e 's/\$${TEMP_CHECK_RESUME_BELOW}/'"$$(tc "$$TEMP_CHECK_RESUME_BELOW")"'/g' \
            -e 's/\$${TEMP_CHECK_POLL_INTERVAL}/'"$$(tc "$$TEMP_CHECK_POLL_INTERVAL")"'/g' \
            -e 's/\$${TEMP_CHECK_CACHE_TTL}/'"$$(tc "$$TEMP_CHECK_CACHE_TTL")"'/g' \
            -e 's/\$${TEMP_CHECK_HTTP_TIMEOUT}/'"$$(tc "$$TEMP_CHECK_HTTP_TIMEOUT")"'/g' \
            -e 's/\$${TEMP_CHECK_STALL_LOG}/'"$$(tc "$$TEMP_CHECK_STALL_LOG")"'/g' \
            -e 's/\$${KEEPALIVE_DELAY}/'"$$(escp "$$KEEPALIVE_DELAY")"'/g' \
            -e 's/\$${KEEPALIVE_INTERVAL}/'"$$(escp "$$KEEPALIVE_INTERVAL")"'/g' \
            /etc/nginx/templates/default.conf.template > /etc/nginx/conf.d/default.conf &&
        /usr/local/openresty/bin/openresty -g 'daemon off;'
